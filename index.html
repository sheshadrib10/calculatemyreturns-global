<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ariel Investments — Powered &amp; Built by Novero</title>
    <meta name="description" content="Ariel Investments, powered &amp; built by Novero. Multi-asset wealth and financial return calculators localized for Singapore, Malaysia, India, Dubai, US, UK, Australia and global wealth hubs. 100% client-side privacy, zero signup." />
    
    <!-- Open Graph & Meta -->
    <meta property="og:title" content="Ariel Investments — Powered &amp; Built by Novero" />
    <meta property="og:description" content="Multi-asset private wealth, systematic equities, prime real estate, and tax shields across global jurisdictions. Powered and built by Novero." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#191514" />

    <!-- Google Fonts: Cormorant Garamond (Financier Display aesthetic), Plus Jakarta Sans, IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=IBM+Plex+Mono:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      :root {
        --font-serif: 'Cormorant Garamond', Georgia, serif;
        --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'IBM Plex Mono', monospace;
      }
      body {
        margin: 0;
        background-color: #191514;
        color: #FAF7F2;
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      .font-serif {
        font-family: var(--font-serif);
      }
      .font-sans {
        font-family: var(--font-sans);
      }
      .font-mono {
        font-family: var(--font-mono);
      }
      /* Lenval luxury scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #191514;
      }
      ::-webkit-scrollbar-thumb {
        background: #382E2B;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8C5E3C;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
